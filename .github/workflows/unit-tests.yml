name: Unit Tests

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]

jobs:
  unit-tests:
    if: |
      github.event_name == 'push' ||
      contains(fromJson('["OWNER", "MEMBER", "COLLABORATOR"]'),
               github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      id: buildx
      uses: docker/setup-buildx-action@v3

    - name: Cache BuildKit Cache Mounts
      uses: actions/cache@v4
      id: cache-buildkit
      with:
        path: .buildkit-cache
        key: ${{ runner.os }}-buildkit-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-buildkit-

    - name: Inject Cache into BuildKit
      uses: reproducible-containers/buildkit-cache-dance@v3
      with:
        builder: ${{ steps.buildx.outputs.name }}
        cache-map: |
          {
            ".buildkit-cache/ccache": "/root/.cache/ccache",
            ".buildkit-cache/cpm": "/root/.cache/cpm"
          }
        skip-extraction: ${{ steps.cache-buildkit.outputs.cache-hit }}

    - name: Build unit test image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ci-scripts/docker/Dockerfile.unittest-multistage
        target: ran-tests
        tags: ran-tests:ci
        load: true
        cache-from: type=gha,scope=ran-unittest-multistage
        cache-to: type=gha,scope=ran-unittest-multistage,mode=max

    - name: Run unit tests
      run: |
        docker run --rm ran-tests:ci \
          ctest --test-dir /oai-ran/build --output-on-failure -j$(nproc)
